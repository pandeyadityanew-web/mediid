<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64" fill="none">
  <!-- Medical Shield Icon -->
  <g transform="translate(6, 4)">
    <!-- Shield Outer with Gradient -->
    <defs>
      <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0284c7"/>
        <stop offset="100%" stop-color="#0369a1"/>
      </linearGradient>
      <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="100%" stop-color="#f8fafc"/>
      </linearGradient>
      <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="125%">
        <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.12"/>
      </filter>
    </defs>
    
    <!-- Shield Path -->
    <path d="M28 2 C44 2, 54 8, 54 8 C54 30, 42 46, 28 54 C14 46, 2 30, 2 8 C2 8, 12 2, 28 2 Z" 
          fill="url(#shieldGrad)" filter="url(#subtleShadow)"/>
    
    <!-- Inner Accent Rim -->
    <path d="M28 5 C41 5, 50 10.5, 50 10.5 C50 29, 39.5 43, 28 50 C16.5 43, 6 29, 6 10.5 C6 10.5, 15 5, 28 5 Z" 
          fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6"/>

    <!-- Emergency Medical Cross -->
    <path d="M24 16 H32 V24 H40 V32 H32 V40 H24 V32 H16 V24 H24 Z" 
          fill="url(#crossGrad)"/>

    <!-- Pulse / Lifeline Detail in Center of Cross -->
    <path d="M19 28 H23 L25 24 L29 32 L31 27 L33 28 H37" 
          stroke="#e11d48" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Typography: SahayID & Tagline -->
  <text x="74" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="28" font-weight="800" letter-spacing="-0.5px" fill="#0f172a">
    Sahay<tspan fill="#0284c7">ID</tspan>
  </text>
  
  <text x="75" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="8.5" font-weight="800" letter-spacing="2.2px" fill="#e11d48">
    CRITICAL MEDICAL ACCESS
  </text>
</svg>
